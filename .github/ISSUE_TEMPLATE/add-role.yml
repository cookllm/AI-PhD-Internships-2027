name: Suggest a role
description: An open PhD internship in AI that this list is missing.
title: "[Add] "
labels: ["add"]
body:
  - type: input
    id: company
    attributes:
      label: Company
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Role title
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Link to the posting on the company's careers page
      placeholder: https://
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Optional. Anything that helps, such as the degree the posting asks for.
